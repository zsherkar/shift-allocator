services:
  - type: web
    name: ish-front-desk-allocator
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        # Set the Neon connection string in the Render Dashboard.
        # Existing values must survive every Blueprint sync.
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERS_JSON
        sync: false

# PostgreSQL is hosted on Neon. Do not provision a Render database here.
# Removing the old declaration leaves the existing Render database intact.
